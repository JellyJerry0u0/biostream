services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: biostream_qdrant
    restart: always
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant base image may not include curl; use bash TCP check instead.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: biostream_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: biostream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # DB가 실제로 응답 가능한지 체크하는 로직 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d biostream"]
      interval: 5s
      timeout: 5s
      retries: 5  

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: biostream_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/biostream
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}  # Gemini API 키 (선택적, .env 파일에서 로드)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}  # Google API 키 (LangGraph용)
      - COACH_LLM_MODEL=${COACH_LLM_MODEL:-gemini-2.5-flash}  # 코치 챗 모델명
      - QDRANT_URL=http://qdrant:6333  # Docker 내부 네트워크에서 Qdrant 접근
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-biostream_corpus_v1}
      - QDRANT_QUANT_COLLECTION=${QDRANT_QUANT_COLLECTION:-quant_evidence}  # 정량 근거 컬렉션
      - GEMINI_EMBED_MODEL=${GEMINI_EMBED_MODEL:-gemini-embedding-001}  # 임베딩 모델명
      - EMBED_DIM=${EMBED_DIM:-768}
      - REPORT_DEBUG=${REPORT_DEBUG:-0}  # 리포트 생성 디버그 모드 (1로 설정 시 상세 로그)
      - MAX_ACTIVE_COMMITTED_HABITS=${MAX_ACTIVE_COMMITTED_HABITS:-12}  # 사용자당 동시 생활습관 최대 개수
      - IMAGE_GENERATION_BASE_URL=${IMAGE_GENERATION_BASE_URL:-}
      - IMAGE_GENERATION_API_URL=${IMAGE_GENERATION_API_URL:-}
      - IMAGE_GENERATION_API_KEY=${IMAGE_GENERATION_API_KEY:-}
      - IMAGE_GENERATION_PATH_GENERATE=${IMAGE_GENERATION_PATH_GENERATE:-}
      - IMAGE_GENERATION_PATH_SKIN_EDIT=${IMAGE_GENERATION_PATH_SKIN_EDIT:-}
      - IMAGE_GENERATION_SKIN_EDIT_MAX_SIDE=${IMAGE_GENERATION_SKIN_EDIT_MAX_SIDE:-}
      - IMAGE_PREPROCESS_MODE=${IMAGE_PREPROCESS_MODE:-}
      - IMAGE_PREPROCESS_FADING_SIZE=${IMAGE_PREPROCESS_FADING_SIZE:-}
      - IMAGE_PREPROCESS_SDXL_CANVAS=${IMAGE_PREPROCESS_SDXL_CANVAS:-}
      - IMAGE_PREPROCESS_MAX_SIDE=${IMAGE_PREPROCESS_MAX_SIDE:-}
      - IMAGE_PREPROCESS_VAE_SCALE=${IMAGE_PREPROCESS_VAE_SCALE:-}
      - IMAGE_COMPARE_CENTER_ZOOM=${IMAGE_COMPARE_CENTER_ZOOM:-}
      # Notion 설정
      - ENABLE_NOTION_EXPORT=${ENABLE_NOTION_EXPORT:-true}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_PAGE_ID=${NOTION_PAGE_ID:-}
      - NOTION_FORMAT_MODE=${NOTION_FORMAT_MODE:-manual}  # manual/llm/compare
      # MCP 서버 도구를 사용하기 위한 환경변수
      - RUNNING_IN_DOCKER=true
      - DB_HOST_DOCKER=db
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=biostream
      - DB_PORT=5432

    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/app:/app/app  # 코드 변경 시 자동 반영 (개발 환경)
      - ./backend/alembic:/app/alembic  # 마이그레이션 파일 반영
      - ./backend/report_modules:/app/report_modules  # 리포트 생성 파이프라인 모듈
      - ./backend/tools:/app/tools  # tools 모듈 마운트
      - ./backend/mcp_server:/app/mcp_server  # MCP 서버 코드도 반영


  mcp_server:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    container_name: biostream_mcp
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - RUNNING_IN_DOCKER=true
      - DB_HOST_DOCKER=db
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=biostream
      - DB_PORT=5432
    # MCP 서버는 stdio를 통해 통신하므로 포트 노출 불필요
    # 필요시 stdio 기반 통신 설정

volumes:
  postgres_data:
  qdrant_data: