name: biostream
description: SkinAI Onboarding Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  http: ^1.1.0 # HTTP 요청용
  flutter_secure_storage: ^9.0.0  # JWT 토큰 안전 저장용
  kakao_flutter_sdk_common: ">=1.9.0 <1.10.0"  # 카카오 SDK 공통 (Flutter 3.19와 호환)
  kakao_flutter_sdk_user: ">=1.9.0 <1.10.0"  # 카카오 로그인 SDK (1.10은 Flutter 3.35+ 필요)
  health: ^11.0.0  # 최신 버전 확인 필요
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  image_picker: ^1.0.7  # 갤러리 및 카메라 이미지 선택용
  intl: ^0.19.0  # 날짜 포맷팅용
  web_socket_channel: ^3.0.1  # 코치 챗봇 WebSocket
  url_launcher: ^6.2.5  # URL 열기용 (Notion 링크)
  share_plus: ^10.0.2  # 외부 앱 공유용
  image_gallery_saver_plus: ^4.0.1  # 갤러리 저장용
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  fl_chart: ^1.2.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

