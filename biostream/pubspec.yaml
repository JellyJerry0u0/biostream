name: biostream
description: SkinAI Onboarding Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  http: ^1.1.0 # HTTP 요청용
  flutter_secure_storage: ^9.0.0  # JWT 토큰 안전 저장용
  kakao_flutter_sdk_user: ^1.9.0  # 카카오 로그인 SDK
  health: ^11.0.0  # 최신 버전 확인 필요
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  image_picker: ^1.0.7  # 갤러리 및 카메라 이미지 선택용

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

